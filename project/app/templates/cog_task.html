<!DOCTYPE html>
<html>
<head>
  <title>{{ task.title }}</title>
  <meta charset="UTF-8">

  <style>
    .option {
      display: block;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .option.selected {
      outline: 3px solid #007bff;
      background-color: #e6f0ff;
    }

    #submit-btn {
      padding: 10px 18px;
      font-size: 16px;
      margin-top: 15px;
    }

    #status-box {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #28a745;
      background: #eafaf1;
    }

    #status-box button {
      margin-right: 10px;
    }
  </style>
</head>

<body>

  <h2>{{ task.title }}</h2>
  <p>{{ task.description }}</p>

  <div id="task-area"></div>

  <button id="submit-btn" disabled>Submit Results</button>

  <div id="status-box">
    <p id="status-text"><b>Response recorded successfully ✅</b></p>
    <button id="next-task-btn" style="display:none;">Next Task →</button>
    <button id="retry-btn">Retry</button>
  </div>

  <script>
    console.count("SCRIPT RUN");

    console.log("JS alive");

    const task = {{ task | tojson }};
    console.log("Task payload:", task);

    let startTime = Date.now();
    let answers = [];

    const taskArea = document.getElementById("task-area");

    console.log("Modules:", task.modules);
    const submitBtn = document.getElementById("submit-btn");
    const statusBox = document.getElementById("status-box");
    const nextBtn = document.getElementById("next-task-btn");
    const retryBtn = document.getElementById("retry-btn");

    function renderQuestion(q) {
      const div = document.createElement("div");

      div.innerHTML = `
        <p><b>${q.prompt}</b></p>
        ${q.options.map(o => `
          <label class="option">
            <input type="radio" name="${q.question_id}" value="${o}">
            ${o}
          </label>
        `).join("")}
        <hr>
      `;

      div.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener("change", () => {
          div.querySelectorAll('.option')
            .forEach(opt => opt.classList.remove('selected'));
          radio.parentElement.classList.add('selected');
          checkAllAnswered();
        });
      });

      return div;
    }

    function checkAllAnswered() {
      let allAnswered = true;

      for (const module of task.modules) {
        for (const q of module.questions) {
          if (!document.querySelector(`input[name="${q.question_id}"]:checked`)) {
            allAnswered = false;
          }
        }
      }

      submitBtn.disabled = !allAnswered;
    }

    // ✅ Render questions (correct data path)
    for (const module of task.modules) {
      for (const q of module.questions) {
        taskArea.appendChild(renderQuestion(q));
      }
    }

    submitBtn.onclick = () => {
      answers = [];
      const endTime = Date.now();

      for (const module of task.modules) {
        for (const q of module.questions) {
          const choice = document.querySelector(
            `input[name="${q.question_id}"]:checked`
          ).value;

          answers.push({
            question_id: q.question_id,
            correct: q.correct,
            time_taken_seconds: (endTime - startTime) / 1000
          });
        }
      }

      fetch("/participant/submit_result", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          participant_id: getCookie("participant_id"),
          task_id: task.task_id,
          modules: [{
            module_name: task.modules[0].module_name,
            questions: answers
          }]
        })
      })
      .then(r => r.json())
      .then(resp => {
        console.log("Submit response:", resp);

        statusBox.style.display = "block";
        submitBtn.disabled = true;

        document.querySelectorAll('input[type="radio"]')
          .forEach(i => i.disabled = true);

        if (resp.session_complete) {
          document.getElementById("status-text").innerHTML =
            "<b>Session complete 🎉 Thank you for participating.</b>";
        } else {
          nextBtn.style.display = "inline-block";
        }
      });
    };

    retryBtn.onclick = () => window.location.reload();

    nextBtn.onclick = () => {
      window.location.href = "/task/{{ next_task_id }}";
    };

    function getCookie(name) {
      const value = "; " + document.cookie;
      const parts = value.split("; " + name + "=");
      if (parts.length === 2) return parts.pop().split(";").shift();
    }
  </script>

</body>
</html>

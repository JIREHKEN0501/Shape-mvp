<!DOCTYPE html>
<html>
<head>
  <title>{{ task.title }}</title>
  <meta charset="UTF-8">

  <style>
    .option {
      display: block;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .option.selected {
      outline: 3px solid #007bff;
      background-color: #e6f0ff;
    }

    #submit-btn {
      padding: 10px 18px;
      font-size: 16px;
      margin-top: 15px;
    }

    #status-box {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #28a745;
      background: #eafaf1;
    }

    #status-box button {
      margin-right: 10px;
    }

    #session-summary {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #ccc;
      background: #f9f9f9;
    }
  </style>
</head>

<body>

  <h2>{{ task.title }}</h2>
  <p>{{ task.description }}</p>

  <div id="task-area"></div>

  <button id="submit-btn" disabled>Submit Results</button>

  <div id="status-box">
    <p id="status-text"><b>Response recorded successfully ✅</b></p>
    <button id="next-task-btn" style="display:none;">Next Task →</button>
    <button id="retry-btn">Retry</button>
  </div>

  <!-- Phase 9B-1: Session summary (hidden by default) -->
  <div id="session-summary">
    <h3>Session Summary</h3>
    <div id="summary-content"></div>
    <p style="font-size:0.9em;color:#555;">
      This reflects how you approached this task, not who you are.
    </p>
  </div>

  <script>
    const task = {{ task | tojson }};

    let startTime = Date.now();
    let answers = [];

    const taskArea = document.getElementById("task-area");
    const submitBtn = document.getElementById("submit-btn");
    const statusBox = document.getElementById("status-box");
    const nextBtn = document.getElementById("next-task-btn");
    const retryBtn = document.getElementById("retry-btn");
    const summaryBox = document.getElementById("session-summary");
    const summaryContent = document.getElementById("summary-content");

    function renderQuestion(q) {
      const div = document.createElement("div");

      div.innerHTML = `
        <p><b>${q.prompt}</b></p>
        ${q.options.map(o => `
          <label class="option">
            <input type="radio" name="${q.question_id}" value="${o}">
            ${o}
          </label>
        `).join("")}
        <hr>
      `;

      div.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener("change", () => {
          div.querySelectorAll('.option')
            .forEach(opt => opt.classList.remove('selected'));
          radio.parentElement.classList.add('selected');
          checkAllAnswered();
        });
      });

      return div;
    }

    function checkAllAnswered() {
      let allAnswered = true;

      for (const module of task.modules) {
        for (const q of module.questions) {
          if (!document.querySelector(`input[name="${q.question_id}"]:checked`)) {
            allAnswered = false;
          }
        }
      }

      submitBtn.disabled = !allAnswered;
    }

    // Render questions (single, correct path)
    for (const module of task.modules) {
      for (const q of module.questions) {
        taskArea.appendChild(renderQuestion(q));
      }
    }


    // -------- Phase 9B-2: Human-readable translations --------

    function describePace(avgTime) {
      if (avgTime === null) return "Not enough data to estimate pace.";
      if (avgTime < 3) return "You responded very quickly overall.";
      if (avgTime < 6) return "You responded at a steady, moderate pace.";
      return "You took a slower, more deliberate pace overall.";
    }

    function describeConsistency(variance) {
      if (variance === null || variance === undefined)
        return "Your response timing was extremely consistent.";
      if (variance < 1) return "Your response times were very consistent.";
      if (variance < 4) return "Your response times showed some variation.";
      return "Your response times varied significantly across questions.";
    }

    function renderSessionSummary(summary) {
      if (!summary) return;

      summaryContent.innerHTML = "";

      // Accuracy
      if (summary.accuracy_ratio !== undefined) {
        const p = document.createElement("p");
        const pct = Math.round(summary.accuracy_ratio * 100);
        p.innerHTML = `<b>Accuracy:</b> ${pct}%`;
        summaryContent.appendChild(p);
      }

      // Pace
      if (summary.avg_time_per_question !== undefined) {
        const p = document.createElement("p");
        p.innerHTML = `<b>Pace:</b> ${
          summary.avg_time_per_question < 4
            ? "You responded very quickly."
            : summary.avg_time_per_question < 7
            ? "You responded at a steady, moderate pace."
            : "You took a more deliberate pace with your responses."
        }`;
        summaryContent.appendChild(p);
      }

      // Consistency
      if (summary.time_variance !== undefined) {
        const p = document.createElement("p");
        p.innerHTML = `<b>Consistency:</b> ${
          summary.time_variance < 1
            ? "Your response times were very consistent."
            : summary.time_variance < 4
            ? "Your response times showed some variation."
            : "Your response times varied significantly."
        }`;
        summaryContent.appendChild(p);
      }

      // High-level profile
      if (summary.speed_accuracy_profile) {
        const p = document.createElement("p");
        const map = {
          fast_accurate: "You worked quickly while maintaining accuracy.",
          slow_accurate: "You took your time and answered carefully.",
          fast_inaccurate: "You moved quickly but accuracy suffered.",
          slow_inaccurate: "You took your time, but accuracy was inconsistent."
        };
        p.innerHTML = `<b>Overall pattern:</b> ${
          map[summary.speed_accuracy_profile] || "No clear pattern detected."
        }`;
        summaryContent.appendChild(p);
      }

      summaryBox.style.display = "block";
    }

    submitBtn.onclick = () => {
      answers = [];
      const endTime = Date.now();

      for (const module of task.modules) {
        for (const q of module.questions) {
          const choice = document.querySelector(
            `input[name="${q.question_id}"]:checked`
          ).value;

          answers.push({
            question_id: q.question_id,
            correct: q.correct,
            user_answer: choice,
            time_taken_seconds: (endTime - startTime) / 1000
          });
        }
      }

      fetch("/participant/submit_result", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          task_id: task.task_id,
          modules: [{
            module_name: task.modules[0].module_name,
            questions: answers
          }]
        })
      })
      .then(r => r.json())
      .then(resp => {
        statusBox.style.display = "block";
        submitBtn.disabled = true;

        document.querySelectorAll('input[type="radio"]')
          .forEach(i => i.disabled = true);

        if (resp.session_complete === true && resp.session_summary) {
          document.getElementById("status-text").innerHTML =
            "<b>Session complete 🎉 Thank you for participating.</b>";

          renderSessionSummary(resp.session_summary);
          nextBtn.style.display = "none";
        } else {
          nextBtn.style.display = "inline-block";
        }
      });
    };

    retryBtn.onclick = () => window.location.reload();

    nextBtn.onclick = () => {
      window.location.href = "/task/{{ next_task_id }}";
    };

    function getCookie(name) {
      const value = "; " + document.cookie;
      const parts = value.split("; " + name + "=");
      if (parts.length === 2) return parts.pop().split(";").shift();
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>{{ task.title }}</title>
  <meta charset="UTF-8">

  <style>
    .option {
      display: block;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .option.selected {
      outline: 3px solid #007bff;
      background-color: #e6f0ff;
    }

    #submit-btn {
      padding: 10px 18px;
      font-size: 16px;
      margin-top: 15px;
    }

    #status-box {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #28a745;
      background: #eafaf1;
    }

    #status-box button {
      margin-right: 10px;
    }
  </style>
</head>

<body>

  <h2>{{ task.title }}</h2>
  <p>{{ task.description }}</p>

  <div id="task-area"></div>

  <button id="submit-btn" disabled>Submit Results</button>

  <!-- POST-SUBMISSION UI -->
  <div id="status-box">
    <p id="status-text"><b>Response recorded successfully ✅</b></p>
    <button id="next-task-btn" style="display:none;">Next Task →</button>
    <button id="retry-btn">Retry</button>
  </div>

  <script>
    let startTime = Date.now();
    let answers = [];

    const task = {{ task | tojson }};
    const nextTaskId = {{ next_task_id | tojson }};
    const isLastTask = {{ is_last_task | tojson }};

    const statusBox = document.getElementById("status-box");
    const nextBtn = document.getElementById("next-task-btn");
    const retryBtn = document.getElementById("retry-btn");

    function renderQuestion(q) {
      let div = document.createElement("div");

      div.innerHTML = `
        <p><b>${q.prompt}</b></p>
        ${q.options.map(o => `
          <label class="option">
            <input type="radio" name="${q.question_id}" value="${o}">
            ${o}
          </label>
        `).join('')}
        <hr>
      `;

      div.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener("change", () => {
          div.querySelectorAll('.option')
            .forEach(opt => opt.classList.remove('selected'));
          radio.parentElement.classList.add('selected');
          checkAllAnswered();
        });
      });

      return div;
    }

    function checkAllAnswered() {
      let allAnswered = true;

      for (let module of task.modules) {
        for (let q of module.questions) {
          if (!document.querySelector(
            `input[name="${q.question_id}"]:checked`
          )) {
            allAnswered = false;
          }
        }
      }

      document.getElementById("submit-btn").disabled = !allAnswered;
    }

    const taskArea = document.getElementById("task-area");

    for (let module of task.modules) {
      for (let q of module.questions) {
        taskArea.appendChild(renderQuestion(q));
      }
    }

    document.getElementById("submit-btn").onclick = () => {
      answers = [];
      let endTime = Date.now();

      for (let module of task.modules) {
        for (let q of module.questions) {
          let choice = document.querySelector(
            `input[name="${q.question_id}"]:checked`
          ).value;

          answers.push({
            question_id: q.question_id,
            correct: q.correct,
            user_answer: choice,
            time_taken_seconds: (endTime - startTime) / 1000
          });
        }
      }

      fetch("/submit_result", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          participant_id: getCookie("participant_id"),
          task_id: task.task_id,
          modules: [
            {
              module_name: task.modules[0].module_name,
              questions: answers
            }
          ]
        })
      })
      .then(r => r.json())
      .then(resp => {
        console.log(resp);

        statusBox.style.display = "block";
        document.getElementById("submit-btn").disabled = true;

        document.querySelectorAll('input[type="radio"]')
          .forEach(i => i.disabled = true);

        // Phase 8B-2-B: show Next Task only if backend allows it
        if (!isLastTask && nextTaskId) {
          nextBtn.style.display = "inline-block";
        }
      });
    };

    retryBtn.onclick = () => {
      window.location.reload();
    };

    nextBtn.onclick = () => {
      window.location.href = `/task/${nextTaskId}`;
    };

    function getCookie(name) {
      let value = "; " + document.cookie;
      let parts = value.split("; " + name + "=");
      if (parts.length === 2) return parts.pop().split(";").shift();
    }
  </script>

</body>
</html>
